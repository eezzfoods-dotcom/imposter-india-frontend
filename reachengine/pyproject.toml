[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reachengine"
version = "0.1.0"
description = "Local-first multi-platform video distribution & analytics tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "EEZZ" }]

# Phase 0 only needs the config/DB/CLI/logging stack. Heavier pipeline deps
# (faster-whisper, pyscenedetect, librosa, opencv, google/meta SDKs) are added
# in the phases that introduce them, per the BRD's one-feature-per-prompt plan.
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "sqlmodel>=0.0.14",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
reachengine = "reachengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
